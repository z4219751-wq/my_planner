<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تکنیک‌های مطالعه | My Planner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #f0f7ff 0%, #e3edfa 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1a2a3a;
        }
        .container { max-width: 900px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #4A90D9 0%, #5BA3E6 100%);
            border-radius: 24px;
            padding: 28px;
            color: white;
            margin-bottom: 24px;
            box-shadow: 0 12px 30px rgba(74, 144, 217, 0.35);
        }
        .header h1 { font-size: 26px; }
        .header .sub { opacity: 0.9; font-size: 15px; }

        .nav-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: white;
            border-radius: 16px;
            padding: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .nav-tabs a {
            flex: 1;
            min-width: 70px;
            text-align: center;
            padding: 10px 12px;
            border-radius: 12px;
            text-decoration: none;
            color: #4a6a85;
            font-weight: 600;
            font-size: 13px;
            transition: 0.3s;
        }
        .nav-tabs a:hover { background: #e8f0fe; }
        .nav-tabs a.active {
            background: linear-gradient(135deg, #4A90D9, #5BA3E6);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 144, 217, 0.3);
        }

        .technique-card {
            background: white;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .technique-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        .technique-card .title { font-size: 18px; font-weight: 700; color: #4A90D9; }
        .technique-card .desc { color: #4a6a85; margin-top: 8px; }
        .technique-card .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .technique-card .tag {
            background: #e8f0fe;
            color: #4A90D9;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 تکنیک‌های مطالعه</h1>
            <div class="sub">بهترین روش‌های مطالعه را یاد بگیرید</div>
        </div>

        <div class="nav-tabs">
            <a href="/">🏠 خانه</a>
            <a href="/planner">📅 پلنر</a>
            <a href="/finance">💰 مالی</a>
            <a href="/habits">🔥 عادت‌ها</a>
            <a href="/study_techniques" class="active">📚 مطالعه</a>
            <a href="/profile">👤 پروفایل</a>
        </div>

        {% for technique in techniques %}
        <div class="technique-card">
            <div class="title">{{ technique.name }}</div>
            <div class="desc">{{ technique.desc }}</div>
            <div class="tags">
                <span class="tag">✅ کاربردی</span>
                <span class="tag">🎯 هدفمند</span>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
