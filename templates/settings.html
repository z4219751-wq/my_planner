<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات | My Planner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(145deg, #f0f7ff 0%, #e3edfa 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 24px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card .back { display: inline-block; color: #4A90D9; text-decoration: none; font-weight: 600; margin-bottom: 16px; }
        .card .back:hover { text-decoration: underline; }
        .card h1 { color: #1a2a3a; font-size: 28px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .card .sub { color: #6b7f94; font-size: 16px; margin-bottom: 20px; }
        .settings-section { border: 2px solid #eef3f8; border-radius: 16px; padding: 16px; margin: 16px 0; }
        .settings-section h3 { color: #1a2a3a; margin-bottom: 12px; }
        .lang-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .lang-btn { padding: 10px 24px; border-radius: 12px; border: 2px solid #dce5ef; text-decoration: none; font-weight: 600; transition: 0.3s; color: #1a2a3a; flex: 1; text-align: center; min-width: 100px; }
        .lang-btn:hover { border-color: #4A90D9; background: #e8f0fe; }
        .lang-btn.active { border-color: #4A90D9; background: #4A90D9; color: white; }
        .save-btn { background: linear-gradient(135deg, #4A90D9, #5BA3E6); color: white; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.3s; width: 100%; margin-top: 12px; }
        .save-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74, 144, 217, 0.4); }
        .info-text { color: #6b7f94; font-size: 14px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <a href="/" class="back">← بازگشت به خانه</a>
            <h1>⚙️ تنظیمات</h1>
            <p class="sub">سفارشی‌سازی اپلیکیشن</p>
            <div class="settings-section">
                <h3>🌍 زبان</h3>
                <div class="lang-buttons">
                    <a href="/set_language/fa" class="lang-btn {% if current_lang == 'fa' %}active{% endif %}">🇮🇷 فارسی</a>
                    <a href="/set_language/en" class="lang-btn {% if current_lang == 'en' %}active{% endif %}">🇬🇧 English</a>
                    <a href="/set_language/ar" class="lang-btn {% if current_lang == 'ar' %}active{% endif %}">🇸🇦 العربية</a>
                </div>
                <div class="info-text">زبان فعلی: 
                    {% if current_lang == 'fa' %}فارسی
                    {% elif current_lang == 'en' %}English
                    {% elif current_lang == 'ar' %}العربية
                    {% endif %}
                </div>
            </div>
            <button class="save-btn" onclick="saveSettings()">💾 ذخیره تنظیمات</button>
        </div>
    </div>
    <script>
        function saveSettings() {
            alert('✅ تنظیمات ذخیره شد!');
        }
    </script>
</body>
</html>
