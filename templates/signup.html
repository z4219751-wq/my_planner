<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | My Planner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #4A90D9 0%, #5BA3E6 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        h1 { text-align: center; margin-bottom: 24px; color: #1a2a3a; }
        input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 2px solid #dce5ef; border-radius: 12px; font-size: 16px; }
        input:focus { outline: none; border-color: #4A90D9; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #4A90D9, #5BA3E6); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .link { text-align: center; margin-top: 16px; }
        .link a { color: #4A90D9; text-decoration: none; }
        .notice { background: #e8f0fe; padding: 12px; border-radius: 12px; margin-bottom: 16px; text-align: center; color: #4A90D9; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 ثبت‌نام در My Planner</h1>
        <div class="notice">🎁 ۵ روز اشتراک رایگان هدیه!</div>
        <form method="POST">
            <input type="text" name="username" placeholder="نام کاربری" required>
            <input type="email" name="email" placeholder="ایمیل" required>
            <input type="password" name="password" placeholder="رمز عبور" required>
            <input type="text" name="full_name" placeholder="نام کامل (اختیاری)">
            <button type="submit">ثبت‌نام</button>
        </form>
        <div class="link">قبلاً ثبت‌نام کردید؟ <a href="/login">ورود</a></div>
    </div>
</body>
</html>
