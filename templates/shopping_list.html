<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست خرید | My Planner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #f0f7ff 0%, #e3edfa 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1a2a3a;
        }
        .container { max-width: 900px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #4A90D9 0%, #5BA3E6 100%);
            border-radius: 24px;
            padding: 28px;
            color: white;
            margin-bottom: 24px;
            box-shadow: 0 12px 30px rgba(74, 144, 217, 0.35);
        }
        .header h1 { font-size: 26px; }
        .header .sub { opacity: 0.9; font-size: 15px; }

        .nav-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: white;
            border-radius: 16px;
            padding: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .nav-tabs a {
            flex: 1;
            min-width: 70px;
            text-align: center;
            padding: 10px 12px;
            border-radius: 12px;
            text-decoration: none;
            color: #4a6a85;
            font-weight: 600;
            font-size: 13px;
            transition: 0.3s;
        }
        .nav-tabs a:hover { background: #e8f0fe; }
        .nav-tabs a.active {
            background: linear-gradient(135deg, #4A90D9, #5BA3E6);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 144, 217, 0.3);
        }

        .section {
            background: white;
            border-radius: 20px;
            padding: 22px 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .section h2 { font-size: 19px; margin-bottom: 16px; }

        .shopping-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eef3f8;
            gap: 12px;
        }
        .shopping-item:last-child { border-bottom: none; }
        .shopping-item .name { flex: 1; font-size: 15px; }
        .shopping-item .category {
            font-size: 12px;
            color: #6b7f94;
            background: #eef3f8;
            padding: 2px 12px;
            border-radius: 12px;
        }
        .shopping-item .delete {
            color: #e74c3c;
            text-decoration: none;
            font-size: 16px;
            opacity: 0.4;
            transition: 0.3s;
        }
        .shopping-item .delete:hover { opacity: 1; }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .form-row input, .form-row select {
            padding: 10px 14px;
            border: 2px solid #dce5ef;
            border-radius: 12px;
            flex: 1;
            min-width: 100px;
            font-size: 14px;
            background: #fafcff;
            transition: 0.3s;
        }
        .form-row input:focus, .form-row select:focus {
            outline: none;
            border-color: #4A90D9;
        }
        .btn {
            background: linear-gradient(135deg, #4A90D9, #5BA3E6);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74, 144, 217, 0.4); }
        .empty-state { text-align: center; color: #9aafc4; padding: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 لیست خرید</h1>
            <div class="sub">خریدهای خود را مدیریت کنید</div>
        </div>

        <div class="nav-tabs">
            <a href="/">🏠 خانه</a>
            <a href="/planner">📅 پلنر</a>
            <a href="/finance">💰 مالی</a>
            <a href="/habits">🔥 عادت‌ها</a>
            <a href="/shopping_list" class="active">🛒 خرید</a>
            <a href="/profile">👤 پروفایل</a>
        </div>

        <div class="section">
            <h2>📋 لیست خرید</h2>
            <div class="empty-state">🛒 لیست خرید شما خالی است</div>
            <!-- بعداً با دیتا پر میشه -->

            <form action="/add_shopping_item" method="POST" class="form-row">
                <input type="text" name="item_name" placeholder="نام کالا..." required>
                <select name="category">
                    <option value="خوراک">🍽 خوراک</option>
                    <option value="پوشاک">👗 پوشاک</option>
                    <option value="الکترونیک">📱 الکترونیک</option>
                    <option value="خانه">🏠 خانه</option>
                    <option value="سایر">📦 سایر</option>
                </select>
                <button type="submit" class="btn">➕ افزودن</button>
            </form>
        </div>
    </div>
</body>
</html>
